name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Embed frontend into the Go server
        run: |
          rm -rf backend/internal/api/dist
          cp -r frontend/dist backend/internal/api/dist

      - name: Build backend (linux + windows)
        working-directory: backend
        run: |
          CGO_ENABLED=0 go build -trimpath -o ../dist/test-linux-amd64 .
          GOOS=windows CGO_ENABLED=0 go build -trimpath -o ../dist/test-windows-amd64.exe .

      - name: Vet
        working-directory: backend
        run: go vet ./...
